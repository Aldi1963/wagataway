name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build server binary (linux/amd64, CGO)
        working-directory: go-backend
        run: CGO_ENABLED=1 go build -ldflags="-s -w" -o server ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Build frontend
        working-directory: go-backend/web
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Package release asset
        run: |
          cd go-backend
          tar -czf wagataway-${{ github.ref_name }}-linux-amd64.tar.gz server web/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: go-backend/wagataway-*.tar.gz
          generate_release_notes: true
          body: |
            ## WaGataway ${{ github.ref_name }}

            WhatsApp Gateway SaaS — single binary Go + frontend React.

            **Isi paket:**
            - `server` — binary Linux amd64 (PostgreSQL, CGO enabled)
            - `web/dist` — hasil build frontend (taruh di direktori kerja `server`)

            **Jalankan:**
            ```bash
            tar -xzf wagataway-${{ github.ref_name }}-linux-amd64.tar.gz
            cp .env.example .env   # isi DATABASE_URL, JWT_SECRET, APP_URL
            ./server
            ```

            **Docker:** `ghcr.io/aldi1963/wagataway:${{ github.ref_name }}`

  publish-docker:
    name: Publish container image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: go-backend
          file: go-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/aldi1963/wagataway:${{ github.ref_name }}
            ghcr.io/aldi1963/wagataway:latest
